<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTML, CSS, JavaScript로 만든 반응속도 테스트 게임입니다.">
  <title>반응속도 테스트 게임 | 문경준</title>
  <style>
    :root {
      --bg: #101114;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f5f1e8;
      --muted: #b8b1a4;
      --accent: #54d18a;
      --warn: #ffbd59;
      --bad: #ef6f6c;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(84, 209, 138, 0.2), transparent 28rem),
        radial-gradient(circle at 82% 15%, rgba(255, 189, 89, 0.16), transparent 24rem),
        linear-gradient(135deg, #101114, #181510 48%, #111916);
      color: var(--text);
    }

    button, select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(980px, 100%);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .chip,
    button,
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 2.35rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-weight: 700;
    }

    select {
      border: 0;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      outline: 0;
    }

    option {
      color: #111;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      border-color: rgba(84, 209, 138, 0.55);
      background: var(--accent);
      color: #07120c;
    }

    .stage {
      display: grid;
      min-height: 360px;
      place-items: center;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background 160ms ease;
    }

    .stage.ready { background: rgba(255, 255, 255, 0.04); }
    .stage.wait { background: rgba(255, 189, 89, 0.15); }
    .stage.go { background: rgba(84, 209, 138, 0.18); }
    .stage.false { background: rgba(239, 111, 108, 0.2); }

    .msg {
      font-size: clamp(1.6rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.25;
    }

    .sub {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      padding: 1rem;
    }

    .panel {
      min-height: 220px;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.14);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .list {
      display: grid;
      gap: 0.5rem;
      max-height: 220px;
      margin-top: 0.7rem;
      overflow: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 0.7rem;
    }

    .stat {
      padding: 0.8rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.055);
      text-align: center;
    }

    .stat h3 {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stat p {
      margin: 0.35rem 0 0;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .key {
      padding: 0.16rem 0.35rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    @media (max-width: 780px) {
      header,
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .stage {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <header>
      <div>
        <h1>반응속도 테스트 게임</h1>
        <div class="sub">신호가 초록색으로 바뀌는 순간 클릭하거나 Space를 누르세요.</div>
      </div>
      <div class="controls">
        <a class="back" href="index.html">포트폴리오</a>
        <label class="chip">라운드
          <select id="rounds">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="7">7</option>
            <option value="10">10</option>
          </select>
        </label>
        <label class="chip">난이도
          <select id="mode">
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
            <option value="pro">프로</option>
          </select>
        </label>
        <button id="resetBtn">초기화</button>
        <button class="primary" id="startBtn">시작</button>
      </div>
    </header>

    <section class="stage ready" id="stage" tabindex="0" aria-label="반응속도 테스트 영역">
      <div class="msg" id="msg"></div>
    </section>

    <section class="grid" aria-label="게임 기록과 통계">
      <div class="panel">
        <div class="row">
          <strong>라운드 기록</strong>
          <span id="roundInfo" class="sub">0 / 0</span>
        </div>
        <div class="list" id="history"></div>
      </div>

      <div class="panel">
        <strong>통계</strong>
        <div class="stats">
          <div class="stat"><h3>평균</h3><p id="avg">-- ms</p></div>
          <div class="stat"><h3>최고</h3><p id="best">-- ms</p></div>
          <div class="stat"><h3>실패</h3><p id="fails">0</p></div>
        </div>
        <div class="sub">개인 최고: <span id="pb">-- ms</span></div>
        <div class="list" id="leader"></div>
      </div>
    </section>

    <footer class="footer">
      <span><span class="key">Space</span> 반응 · <span class="key">Enter</span> 시작/다음 · <span class="key">R</span> 초기화</span>
      <span>Vanilla JS · LocalStorage</span>
    </footer>
  </div>

  <script>
    (() => {
      const el = (id) => document.getElementById(id);
      const stage = el("stage");
      const msg = el("msg");
      const startBtn = el("startBtn");
      const resetBtn = el("resetBtn");
      const roundsSel = el("rounds");
      const modeSel = el("mode");
      const history = el("history");
      const roundInfo = el("roundInfo");
      const avgEl = el("avg");
      const bestEl = el("best");
      const failsEl = el("fails");
      const pbEl = el("pb");
      const leader = el("leader");

      const stateName = { idle: "idle", waiting: "waiting", go: "go", false: "false" };
      let state = stateName.idle;
      let totalRounds = Number(roundsSel.value);
      let timer = null;
      let startedAt = 0;
      let results = [];
      let falseStarts = 0;

      const storageKey = "reaction_speed_leaderboard_v1";
      const readBoard = () => {
        try {
          return JSON.parse(localStorage.getItem(storageKey) || "[]");
        } catch {
          return [];
        }
      };
      const writeBoard = (rows) => localStorage.setItem(storageKey, JSON.stringify(rows.slice(0, 10)));
      const mean = (values) => values.length ? values.reduce((a, b) => a + b, 0) / values.length : NaN;
      const fmt = (value) => Number.isFinite(value) ? `${Math.round(value)} ms` : "-- ms";

      function delayFor(mode) {
        if (mode === "normal") return 700 + Math.random() * 1300;
        if (mode === "hard") return 1000 + Math.random() * 2200;
        return 1800 + Math.random() * 3800;
      }

      function hint() {
        return '<div class="sub">클릭 또는 Space로 반응하고, Enter로 다음 라운드를 시작합니다.</div>';
      }

      function setState(next) {
        state = next;
        stage.classList.remove("ready", "wait", "go", "false");
        if (next === stateName.idle) {
          stage.classList.add("ready");
          msg.innerHTML = `준비 완료${hint()}`;
        }
        if (next === stateName.waiting) {
          stage.classList.add("wait");
          msg.innerHTML = '대기 중<div class="sub">초록색 신호가 나오기 전에는 누르지 마세요.</div>';
        }
        if (next === stateName.go) {
          stage.classList.add("go");
          msg.innerHTML = "지금!";
        }
        if (next === stateName.false) {
          stage.classList.add("false");
          msg.innerHTML = '너무 빨랐어요<div class="sub">신호 전 입력은 실패로 기록됩니다.</div>';
        }
      }

      function updatePanels() {
        roundInfo.textContent = `${Math.min(results.length, totalRounds)} / ${totalRounds}`;
        history.innerHTML = "";
        results.forEach((result, index) => {
          const row = document.createElement("div");
          row.className = "row chip";
          row.innerHTML = result.fail
            ? `<span>#${index + 1}</span><strong style="color: var(--bad)">실패</strong>`
            : `<span>#${index + 1}</span><strong style="color: var(--accent)">${Math.round(result.ms)} ms</strong>`;
          history.appendChild(row);
        });

        const valid = results.filter((result) => !result.fail).map((result) => result.ms);
        avgEl.textContent = fmt(mean(valid));
        bestEl.textContent = fmt(Math.min(...valid));
        failsEl.textContent = String(falseStarts);

        const board = readBoard();
        pbEl.textContent = board.length ? `${board[0].best} ms` : "-- ms";
        leader.innerHTML = "";
        board.forEach((entry, index) => {
          const row = document.createElement("div");
          row.className = "row chip";
          row.innerHTML = `<span>${index + 1}위</span><span>최고 ${entry.best} ms · 평균 ${entry.avg} ms</span>`;
          leader.appendChild(row);
        });
      }

      function finishSet() {
        const valid = results.filter((result) => !result.fail).map((result) => Math.round(result.ms));
        if (valid.length) {
          const entry = {
            best: Math.min(...valid),
            avg: Math.round(mean(valid)),
            ts: Date.now()
          };
          const board = readBoard();
          board.push(entry);
          board.sort((a, b) => a.best - b.best || a.avg - b.avg);
          writeBoard(board);
        }
        updatePanels();
        setState(stateName.idle);
        msg.innerHTML = `세트 완료<div class="sub">평균 ${avgEl.textContent} · 최고 ${bestEl.textContent}</div>`;
      }

      function startRound() {
        if (results.length >= totalRounds) {
          finishSet();
          return;
        }
        clearTimeout(timer);
        setState(stateName.waiting);
        timer = setTimeout(() => {
          startedAt = performance.now();
          setState(stateName.go);
        }, delayFor(modeSel.value));
      }

      function react() {
        if (state === stateName.waiting) {
          clearTimeout(timer);
          falseStarts += 1;
          results.push({ fail: true, ms: 0 });
          setState(stateName.false);
          updatePanels();
          return;
        }
        if (state === stateName.go) {
          results.push({ fail: false, ms: performance.now() - startedAt });
          updatePanels();
          setState(stateName.idle);
          msg.innerHTML = `기록: <strong>${Math.round(results.at(-1).ms)} ms</strong><div class="sub">Enter로 다음 라운드를 시작하세요.</div>`;
        }
      }

      startBtn.addEventListener("click", () => {
        if (results.length >= totalRounds) {
          results = [];
          falseStarts = 0;
          updatePanels();
        }
        startRound();
      });

      resetBtn.addEventListener("click", () => {
        clearTimeout(timer);
        results = [];
        falseStarts = 0;
        updatePanels();
        setState(stateName.idle);
      });

      stage.addEventListener("pointerdown", react);
      roundsSel.addEventListener("change", () => {
        totalRounds = Number(roundsSel.value);
        resetBtn.click();
      });

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          react();
        }
        if (event.code === "Enter") {
          event.preventDefault();
          if (state === stateName.idle || state === stateName.false) startRound();
        }
        if (event.key === "r" || event.key === "R") resetBtn.click();
      });

      updatePanels();
      setState(stateName.idle);
    })();
  </script>
</body>
</html>
